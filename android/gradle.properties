# Disabled because this machine physically lacks the RAM/Paging file to run the daemon
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true

# --- CRITICAL FIXES (Do not remove) ---
# Memory tuning — 2G max (prevents Windows OOM kill, but gives enough RAM to not crash)
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+UseG1GC

# Required for Flutter
android.useAndroidX=true

# Fixes Windows cross-drive path error (project on D:\ vs pub cache on C:\)
android.overridePathCheck=true
kotlin.incremental=false